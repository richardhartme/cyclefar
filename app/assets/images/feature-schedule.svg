<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Training days picker</title>
  <desc id="d">A weekly schedule with Intervals on Tuesday and Saturday and Endurance on Thursday and Sunday, totalling 330 minutes over 12 weeks.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#312e81" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="640" height="600" rx="40" fill="#e0e7ff"/>
  <rect x="40" y="40" width="560" height="500" rx="24" fill="#fff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <text x="72" y="92" font-size="20" font-weight="700" fill="#0f172a">Training days</text>
  <text x="84" y="146" font-size="18" fill="#94a3b8">Mon</text>
  <text x="320" y="146" font-size="18" fill="#94a3b8" text-anchor="middle">Rest</text>
  <rect x="64" y="168" width="512" height="44" rx="10" fill="#f8fafc"/>
  <text x="84" y="196" font-size="18" font-weight="500" fill="#0f172a">Tue</text>
  <rect x="272" y="177" width="96" height="26" rx="13" fill="#fef3c7"/>
  <text x="320" y="195" font-size="14" font-weight="600" fill="#92400e" text-anchor="middle">Intervals</text>
  <text x="556" y="196" font-size="18" fill="#475569" text-anchor="end">60 min</text>
  <text x="84" y="246" font-size="18" fill="#94a3b8">Wed</text>
  <text x="320" y="246" font-size="18" fill="#94a3b8" text-anchor="middle">Rest</text>
  <rect x="64" y="268" width="512" height="44" rx="10" fill="#f8fafc"/>
  <text x="84" y="296" font-size="18" font-weight="500" fill="#0f172a">Thu</text>
  <rect x="267" y="277" width="106" height="26" rx="13" fill="#e0f2fe"/>
  <text x="320" y="295" font-size="14" font-weight="600" fill="#075985" text-anchor="middle">Endurance</text>
  <text x="556" y="296" font-size="18" fill="#475569" text-anchor="end">90 min</text>
  <text x="84" y="346" font-size="18" fill="#94a3b8">Fri</text>
  <text x="320" y="346" font-size="18" fill="#94a3b8" text-anchor="middle">Rest</text>
  <rect x="64" y="368" width="512" height="44" rx="10" fill="#f8fafc"/>
  <text x="84" y="396" font-size="18" font-weight="500" fill="#0f172a">Sat</text>
  <rect x="272" y="377" width="96" height="26" rx="13" fill="#fef3c7"/>
  <text x="320" y="395" font-size="14" font-weight="600" fill="#92400e" text-anchor="middle">Intervals</text>
  <text x="556" y="396" font-size="18" fill="#475569" text-anchor="end">60 min</text>
  <rect x="64" y="418" width="512" height="44" rx="10" fill="#f8fafc"/>
  <text x="84" y="446" font-size="18" font-weight="500" fill="#0f172a">Sun</text>
  <rect x="267" y="427" width="106" height="26" rx="13" fill="#e0f2fe"/>
  <text x="320" y="445" font-size="14" font-weight="600" fill="#075985" text-anchor="middle">Endurance</text>
  <text x="556" y="446" font-size="18" fill="#475569" text-anchor="end">120 min</text>
  <rect x="364" y="492" width="236" height="76" rx="16" fill="#fff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <text x="384" y="520" font-size="14" fill="#64748b">Weekly total</text>
  <text x="384" y="549" font-size="24" font-weight="700" fill="#0f172a">330 min<tspan font-size="16" font-weight="500" fill="#432dd7"> · 12 weeks</tspan></text>
