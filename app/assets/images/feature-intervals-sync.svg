      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#312e81" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="640" height="420" rx="40" fill="#ccfbf1"/>
  <rect x="40" y="40" width="560" height="340" rx="24" fill="#fff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <text x="72" y="96" font-size="22" font-weight="700" fill="#0f172a">Intervals.icu</text>
  <rect x="484" y="72" width="84" height="28" rx="14" fill="#ccfbf1"/>
