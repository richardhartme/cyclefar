  <text x="548" y="162" font-size="16" fill="#64748b" text-anchor="end">Tue</text>
  <rect x="72" y="200" width="496" height="56" rx="12" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="92" y="234" font-size="18" font-weight="600" fill="#0f172a">Endurance 90 min</text>
  <text x="548" y="234" font-size="16" fill="#64748b" text-anchor="end">Thu</text>
