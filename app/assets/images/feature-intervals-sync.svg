<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Intervals.icu sync</title>
  <desc id="d">Two upcoming workouts, Threshold 3x8 on Tuesday and Endurance 90 minutes on Thursday, shown as synced to an Intervals.icu calendar.</desc>
